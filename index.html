<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reservá tu turno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#09090b;--card:#0f0f12;--card2:#141418;--line:#26262c;--ink:#f4f4f5;--mute:#8b8b95;--err:#f08a8a;--ok:#8fd3a4;
--serif:"Playfair Display",Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 20px var(--serif)}
.brand b{display:block;font:600 18px var(--serif)}
.brand small{color:var(--mute);font-size:12px}
main{max-width:480px;margin:0 auto;padding:20px 16px 20px}
.intro{text-align:center;color:var(--mute);margin:8px 0 6px}
.step{text-align:center;color:var(--mute);font-size:13px;margin-bottom:16px}
.step b{color:var(--ink);font-weight:500}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 16px}
h2{font:500 22px var(--serif);margin:0 0 16px}
button{font:inherit;color:inherit;cursor:pointer}
.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.date{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 0;text-align:center}
.date small{display:block;color:var(--mute);font-size:11px;letter-spacing:.06em}
.date b{display:block;font:500 22px var(--serif);margin:2px 0}
.date:disabled{opacity:.35;cursor:not-allowed}
.date.sel{border-color:var(--ink)}
.times{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.time{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px 0;text-align:center}
.time.off{opacity:.4;text-decoration:line-through}
.more{margin-top:12px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.hint{color:var(--mute);font-size:13px;margin:12px 0 0}
.err{color:var(--err);font-size:14px;margin:12px 0 0}
.good{color:var(--ok)}
.back{display:inline-flex;margin-top:18px;background:none;border:0;color:var(--mute);padding:4px 0}
.sum{margin-bottom:14px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.sum span{color:var(--mute)}
label{display:block;margin:14px 0 6px;font-size:13px;color:var(--mute)}
input,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);font:inherit}
.btn{width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.tab.sel{border-color:var(--ink)}
.res{border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:12px;margin-bottom:10px}
.res b{display:block;font:500 17px var(--serif)}
.res p{margin:4px 0;color:var(--mute);font-size:14px}
.res a{color:var(--ink)}
.res button{margin-top:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--err)}
footer{text-align:center;padding:8px 16px 28px}
footer button{background:none;border:0;color:var(--mute);font-size:12px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<header><div class="logo" id="lg"></div><div class="brand"><b id="nm"></b><small>Reservas online</small></div></header>
<main id="app"></main>
<footer><button id="adm">Administrar</button></footer>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// === Configuración ===
const firebaseConfig = {
  apiKey: "AIzaSyC-IFjQyHClAmEeEJiDrb88j61ZMvN7Plg",
  authDomain: "peluqueria-reservas-3c1a0.firebaseapp.com",
  projectId: "peluqueria-reservas-3c1a0",
  storageBucket: "peluqueria-reservas-3c1a0.firebasestorage.app",
  messagingSenderId: "972935083950",
  appId: "1:972935083950:web:18cc2e783c51e4f2a4ba3f"
};
const NOMBRE = "Peluquería";           // nombre que se muestra arriba
const SERVICIO = "Corte de cabello";
const PRECIO = "$8.000";
const HORAS = [18, 19, 20, 21];       // turnos de 1 hora, de 18 a 22
const DIAS_ADELANTE = 28;
// =====================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.getElementById("nm").textContent = NOMBRE;
document.getElementById("lg").textContent = NOMBRE.charAt(0);

let taken = new Set(), reservas = [], resIds = new Set();
let view = location.hash === "#admin" ? "admin" : "cliente";
let user = null, adminErr = "", tab = "turnos", unsubRes = null;
let step = 1, selDay = null, selHour = null, showAll = false, msg = "", done = null, loadErr = false, loaded = false;

const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const key = (d, h) => d + "_" + pad(h);
const parse = s => { const p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); };
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
const up = s => s.replace(".", "").toUpperCase();
const longDay = s => parse(s).toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
function days() { const o = [], t = new Date(); for (let i = 0; i < DIAS_ADELANTE; i++) { const x = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i); if (x.getDay() >= 1 && x.getDay() <= 5) o.push(x); } return o; }
function isPast(d, h) { const n = new Date(); if (d < iso(n)) return true; return d === iso(n) && h <= n.getHours(); }
const free = d => HORAS.some(h => !taken.has(key(d, h)) && !isPast(d, h));

onSnapshot(collection(db, "turnos"), snap => {
  taken = new Set(snap.docs.map(d => d.id)); loaded = true; loadErr = false;
  if (!(view === "cliente" && step === 3)) render();
}, () => { loadErr = true; render(); });

onAuthStateChanged(auth, u => {
  user = u; adminErr = "";
  if (unsubRes) { unsubRes(); unsubRes = null; }
  reservas = []; resIds = new Set();
  if (u) {
    unsubRes = onSnapshot(collection(db, "reservas"), snap => {
      reservas = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => a.id < b.id ? -1 : 1);
      resIds = new Set(reservas.map(r => r.id)); adminErr = ""; if (view === "admin") render();
    }, () => { adminErr = "Esta cuenta no tiene permiso para administrar."; if (view === "admin") render(); });
  }
  if (view === "admin") render();
});

function render() {
  const el = document.getElementById("app");
  document.getElementById("adm").textContent = view === "admin" ? "Volver a reservas" : "Administrar";
  el.innerHTML = view === "admin" ? adminHtml() : clientHtml();
  bind();
}

function datesHtml(onlyFree) {
  const ds = days(), list = showAll ? ds : ds.slice(0, 8);
  let h = '<div class="dates">';
  list.forEach(x => { const i = iso(x);
    h += '<button class="date' + (i === selDay ? " sel" : "") + '" data-day="' + i + '"' + (onlyFree && !free(i) ? " disabled" : "") + '><small>' + up(x.toLocaleDateString("es-AR", { weekday: "short" })) + '</small><b>' + x.getDate() + '</b><small>' + up(x.toLocaleDateString("es-AR", { month: "short" })) + '</small></button>'; });
  h += "</div>";
  if (!showAll && ds.length > 8) h += '<button class="more" id="more">Ver más fechas</button>';
  return h;
}

function clientHtml() {
  if (done) return '<div class="panel"><h2>Turno reservado</h2><div class="sum"><div><span>Servicio</span><b>' + esc(SERVICIO) + '</b></div><div><span>Fecha</span><b>' + esc(longDay(done.d)) + '</b></div><div><span>Hora</span><b>' + done.h + ':00</b></div><div><span>A nombre de</span><b>' + esc(done.n) + '</b></div></div><p class="hint good">Te esperamos. Si no podés venir, avisanos con tiempo.</p><button class="btn sec" id="again">Reservar otro turno</button></div>';
  let h = '<p class="intro">' + esc(SERVICIO) + " · " + PRECIO + " · 60 minutos</p>";
  h += '<div class="step">Paso ' + step + " de 3 - <b>" + ["Fecha", "Horario", "Confirmar"][step - 1] + "</b></div>";
  if (loadErr) return h + '<div class="panel"><p class="err">No pudimos cargar los horarios. Revisá tu conexión y recargá la página.</p></div>';
  if (!loaded) return h + '<div class="panel"><p class="hint">Cargando horarios…</p></div>';
  h += '<div class="panel">';
  if (step === 1) h += "<h2>Elegí una fecha</h2>" + datesHtml(true) + '<p class="hint">Atendemos de lunes a viernes de 18 a 22.</p>';
  if (step === 2) {
    h += "<h2>Elegí un horario</h2>" + '<p class="hint" style="margin:-8px 0 12px">' + esc(longDay(selDay)) + "</p>" + '<div class="times">';
    let n = 0;
    HORAS.forEach(hr => { if (!taken.has(key(selDay, hr)) && !isPast(selDay, hr)) { n++; h += '<button class="time" data-hour="' + hr + '">' + hr + ":00</button>"; } });
    h += "</div>";
    if (!n) h += '<p class="hint">Ya no quedan horarios este día. Elegí otra fecha.</p>';
  }
  if (step === 3) {
    h += "<h2>Confirmá tu reserva</h2>" + '<div class="sum"><div><span>Servicio</span><b>' + esc(SERVICIO) + "</b></div><div><span>Fecha</span><b>" + esc(longDay(selDay)) + "</b></div><div><span>Hora</span><b>" + selHour + ":00</b></div><div><span>Precio</span><b>" + PRECIO + "</b></div></div>"
      + '<label for="n">Tu nombre</label><input id="n" autocomplete="name" maxlength="60" placeholder="Nombre y apellido">'
      + '<label for="t">Tu teléfono</label><input id="t" type="tel" autocomplete="tel" maxlength="20" placeholder="Para avisarte si hay un cambio">'
      + '<label for="m">Comentarios (opcional)</label><textarea id="m" rows="2" maxlength="200"></textarea>'
      + '<button class="btn" id="go" disabled>Confirmar reserva</button>';
  }
  if (msg) h += '<p class="err">' + esc(msg) + "</p>";
  h += "</div>";
  if (step > 1) h += '<button class="back" id="back">← Volver</button>';
  return h;
}

function adminHtml() {
  if (!user) return '<div class="panel"><h2>Administración</h2><p class="hint" style="margin:0 0 4px">Entrá con tu cuenta de Google para ver y gestionar los turnos.</p><button class="btn" id="login">Entrar con Google</button></div>';
  if (adminErr) return '<div class="panel"><h2>Administración</h2><p class="err">' + esc(adminErr) + '</p><button class="btn sec" id="logout">Salir</button></div>';
  let h = '<div class="tabs"><button class="tab' + (tab === "turnos" ? " sel" : "") + '" data-tab="turnos">Turnos</button><button class="tab' + (tab === "bloq" ? " sel" : "") + '" data-tab="bloq">Bloquear horarios</button></div><div class="panel">';
  if (tab === "turnos") {
    const hoy = iso(new Date()), prox = reservas.filter(r => r.id.slice(0, 10) >= hoy);
    h += "<h2>Próximos turnos</h2>";
    if (!prox.length) h += '<p class="hint">Todavía no hay turnos reservados.</p>';
    prox.forEach(r => { const d = r.id.slice(0, 10), hr = +r.id.slice(11), tel = String(r.telefono || "").replace(/[^0-9+]/g, "");
      h += '<div class="res"><b>' + esc(longDay(d)) + " · " + hr + ":00</b><p>" + esc(r.nombre || "") + (tel ? ' · <a href="tel:' + esc(tel) + '">' + esc(r.telefono) + "</a>" : "") + "</p>" + (r.nota ? "<p>" + esc(r.nota) + "</p>" : "") + '<button data-cancel="' + esc(r.id) + '">Cancelar turno</button></div>'; });
  } else {
    h += "<h2>Bloquear horarios</h2>" + datesHtml(false);
    if (selDay) {
      h += '<p class="hint">' + esc(longDay(selDay)) + ". Tocá un horario para bloquearlo o liberarlo.</p><div class=\"times\" style=\"margin-top:10px\">";
      HORAS.forEach(hr => { const k = key(selDay, hr); h += '<button class="time' + (taken.has(k) ? " off" : "") + '" data-blk="' + k + '">' + hr + ":00</button>"; });
      h += "</div>";
    }
    if (msg) h += '<p class="err">' + esc(msg) + "</p>";
  }
  h += '</div><button class="back" id="logout">Salir</button>';
  return h;
}

function bind() {
  const on = (s, f) => document.querySelectorAll(s).forEach(b => b.onclick = () => f(b));
  on("[data-day]", b => { selDay = b.dataset.day; msg = ""; if (view === "cliente") step = 2; render(); });
  on("[data-hour]", b => { selHour = +b.dataset.hour; step = 3; msg = ""; render(); });
  on("[data-tab]", b => { tab = b.dataset.tab; msg = ""; render(); });
  on("[data-blk]", async b => { const k = b.dataset.blk; msg = "";
    try { const bt = writeBatch(db);
      if (taken.has(k)) { if (resIds.has(k)) { msg = "Ese horario tiene una reserva. Cancelala desde Turnos."; render(); return; } bt.delete(doc(db, "turnos", k)); }
      else bt.set(doc(db, "turnos", k), { ok: true });
      await bt.commit(); } catch (e) { msg = "No se pudo guardar el cambio."; render(); } });
  on("[data-cancel]", async b => { const k = b.dataset.cancel;
    if (!confirm("¿Cancelar este turno? El horario vuelve a quedar libre.")) return;
    try { const bt = writeBatch(db); bt.delete(doc(db, "reservas", k)); bt.delete(doc(db, "turnos", k)); await bt.commit(); } catch (e) { alert("No se pudo cancelar el turno."); } });
  const q = id => document.getElementById(id);
  if (q("more")) q("more").onclick = () => { showAll = true; render(); };
  if (q("back")) q("back").onclick = () => { step--; msg = ""; render(); };
  if (q("again")) q("again").onclick = () => { done = null; step = 1; selDay = selHour = null; render(); };
  if (q("login")) q("login").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(() => { adminErr = "No se pudo iniciar sesión."; render(); });
  if (q("logout")) q("logout").onclick = () => signOut(auth);
  if (q("go")) {
    const n = q("n"), t = q("t"), upd = () => q("go").disabled = n.value.trim().length < 2 || t.value.replace(/\D/g, "").length < 6;
    n.oninput = upd; t.oninput = upd; q("go").onclick = reservar;
  }
}

async function reservar() {
  const btn = document.getElementById("go"); btn.disabled = true; btn.textContent = "Reservando…"; msg = "";
  const n = document.getElementById("n").value.trim(), t = document.getElementById("t").value.trim(), m = document.getElementById("m").value.trim();
  const k = key(selDay, selHour);
  try {
    const bt = writeBatch(db);
    bt.set(doc(db, "turnos", k), { ok: true });
    bt.set(doc(db, "reservas", k), { nombre: n, telefono: t, nota: m, creado: serverTimestamp() });
    await bt.commit();
    done = { d: selDay, h: selHour, n }; render();
  } catch (e) {
    if (e && e.code === "permission-denied") { msg = "Ese horario se acaba de ocupar. Elegí otro."; step = 2; }
    else { msg = "No se pudo reservar. Revisá tu conexión e intentá de nuevo."; }
    render();
  }
}

document.getElementById("adm").onclick = () => { view = view === "admin" ? "cliente" : "admin"; msg = ""; showAll = false; selDay = null; step = 1; render(); };
render();
</script>
</body>
</html>
